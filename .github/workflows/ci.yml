name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions: {}

jobs:
    astro:
        name: astro check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                persist-credentials: false
            
            - uses: pnpm/action-setup@v6
              with:
                version: 11.x
            
            - uses: actions/setup-node@v6
              with:
                node-version: 24.x
                cache: pnpm
                cache-dependency-path: ./pnpm-lock.yaml
            
            - run: pnpm install
            - run: pnpm check
